name: 04 - Deploy to Production

on:
  # Task 9.3C - Continuous Deployment:
  # production now deploys automatically once the staging smoke test passes
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  # Kept as a manual fallback (e.g. rollback to an earlier tested SHA)
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

# Never run two production deployments at the same time
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Automatic run: only if the staging smoke test succeeded
    # Manual run: always allowed
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production

    env:
      # Same image SHA that was built by CI and tested in staging (no rebuild)
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Show image tag being promoted
        run: |
          echo "Promoting tested image tag: ${IMAGE_TAG}"
          echo "### Promoting image tag \`${IMAGE_TAG}\` to production" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tested image exists in ACR
        run: |
          az acr repository show \
            --name ${{ vars.ACR_NAME }} \
            --image koalatech-frontend:${IMAGE_TAG}

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # Task 10.2D - the storage account is now created by Terraform, so read its
      # connection string from Azure at deploy time instead of a static secret.
      - name: Get storage connection string
        run: |
          CONN=$(az storage account show-connection-string \
            --name ${{ vars.STORAGE_ACCOUNT_NAME }} \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --query connectionString -o tsv)
          echo "::add-mask::$CONN"
          echo "AZURE_STORAGE_CONNECTION_STRING=$CONN" >> "$GITHUB_ENV"

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ env.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

      - name: Production smoke test
        run: |
          for i in {1..30}; do
            FRONTEND_IP=$(kubectl get service frontend \
              -n production \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$FRONTEND_IP" ]; then
              break
            fi

            echo "Waiting for production frontend IP..."
            sleep 10
          done

          if [ -z "$FRONTEND_IP" ]; then
            echo "Unable to find production frontend IP."
            exit 1
          fi

          curl --fail --retry 10 --retry-delay 5 "http://${FRONTEND_IP}"

          echo "Production URL: http://${FRONTEND_IP}" >> "$GITHUB_STEP_SUMMARY"

      # Task 10.2D - confirm Prometheus is scraping the production services
      - name: Validate production metrics in Prometheus
        run: |
          kubectl get servicemonitor -n production
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-prometheus 9090:9090 >/dev/null 2>&1 &
          for i in {1..12}; do
            sleep 10
            UP=$(curl -s "http://localhost:9090/api/v1/query" \
              --data-urlencode 'query=sum(up{namespace="production", job=~".*-service"})' \
              | jq -r '.data.result[0].value[1] // "0"')
            echo "Production services scraped by Prometheus: ${UP}/5"
            if [ "$UP" = "5" ]; then
              echo "### Prometheus is scraping all 5 production services" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "Prometheus is not scraping all production services"
          exit 1
